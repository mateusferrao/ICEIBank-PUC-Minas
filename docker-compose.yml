# Sobe as 3 agências do ICEIBank + o frontend com um comando (docker compose up).
# Preparação para o Sprint 4 (Computação em Nuvem / Containers).
#
# - Cada agência roda o mesmo código, com AGENCIA_ID diferente.
# - A comunicação entre agências agora passa pelo RabbitMQ (CloudAMQP): defina
#   RABBITMQ_URL no .env da raiz (o compose lê esse arquivo automaticamente).
# - As portas são mapeadas para o host para o navegador (frontend) alcançar a API.
# - O JWT_SECRET é o mesmo nas três (login em qualquer uma).

x-agencia-env: &agencia-env
  JWT_SECRET: iceibank-sprint1-segredo-compartilhado
  RABBITMQ_URL: ${RABBITMQ_URL:?defina RABBITMQ_URL no arquivo .env da raiz}
  AGENCIA_0_HOST: agencia-0
  AGENCIA_1_HOST: agencia-1
  AGENCIA_2_HOST: agencia-2

services:
  agencia-0:
    build: ./agencia
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 4000
    environment:
      <<: *agencia-env
      AGENCIA_ID: 0
    ports:
      - "4000:4000"
    volumes:
      - ./agencia/data:/app/data

  agencia-1:
    build: ./agencia
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 4001
    environment:
      <<: *agencia-env
      AGENCIA_ID: 1
    ports:
      - "4001:4001"
    volumes:
      - ./agencia/data:/app/data

  agencia-2:
    build: ./agencia
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 4002
    environment:
      <<: *agencia-env
      AGENCIA_ID: 2
    ports:
      - "4002:4002"
    volumes:
      - ./agencia/data:/app/data

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5500:80"
    depends_on:
      - agencia-0
      - agencia-1
      - agencia-2
